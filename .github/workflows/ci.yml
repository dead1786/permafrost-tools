name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile hooks/self-guard.py
          python -m py_compile hooks/install.py
          python -m py_compile tools/memory-gc.py
          python -m py_compile tools/pitfall-tracker.py
          python -m py_compile tools/frost-scheduler/frost-scheduler.py
          python -m py_compile tools/frost-scheduler/frost-ack.py
          python -m py_compile tools/frost-scheduler/install.py
          python -m py_compile tools/frost-collab/frost-collab.py
          python -m py_compile claude-i18n/patch.py

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check hooks/ tools/ claude-i18n/ --select=E9,F63,F7,F82 --target-version=py38

  lint-node:
    name: Lint Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Check Node.js syntax
        run: |
          node --check claude-whisper/bin/cli.mjs
          node --check claude-whisper/src/store.mjs
          node --check claude-whisper/src/setup.mjs
          node --check claude-whisper/hook/whisper-hook.mjs
          node --check claude-whisper/test/setup.test.mjs

  test-whisper-cli:
    name: Test claude-whisper CLI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test CLI commands
        run: |
          node claude-whisper/bin/cli.mjs help
          node claude-whisper/bin/cli.mjs version

      - name: Test settings.json install/uninstall (isolated HOME)
        run: node --test claude-whisper/test/setup.test.mjs

  test-python-compat:
    name: Test Python compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python tools load
        shell: bash
        run: |
          python -c "exec(open('hooks/self-guard.py').read().split('def load_config')[0], {'__file__': 'hooks/self-guard.py', '__name__': 'self_guard_check'})"
          python tools/memory-gc.py stats 2>/dev/null || true
          python tools/pitfall-tracker.py list 2>/dev/null || true

  scan-hidden-chars:
    name: Scan for hidden/zero-width characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if zero-width or invisible Unicode chars are tracked
        run: |
          python3 - <<'EOF'
          import subprocess, sys

          # U+200B ZERO WIDTH SPACE, U+200C ZWNJ, U+200D ZWJ, U+FEFF BOM,
          # U+2060 WORD JOINER, U+00AD SOFT HYPHEN — none of these belong in
          # source/docs and are a known steganography / prompt-injection vector.
          # Written as \uXXXX escapes (not literal characters) on purpose: if
          # this file embedded the real characters, this job would flag
          # itself as soon as ci.yml became a tracked file.
          SUSPECT = ["\u200b", "\u200c", "\u200d", "\ufeff", "\u2060", "\u00ad"]

          files = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()

          skip_ext = (".png", ".jpg", ".jpeg", ".gif", ".ico", ".pyc", ".woff", ".woff2")
          hits = []
          for path in files:
              if path.lower().endswith(skip_ext):
                  continue
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = f.read()
              except (UnicodeDecodeError, FileNotFoundError, IsADirectoryError):
                  continue
              for ch in SUSPECT:
                  if ch in data:
                      hits.append((path, f"U+{ord(ch):04X}", data.count(ch)))

          if hits:
              print("Found hidden/zero-width characters in tracked files:")
              for path, code, count in hits:
                  print(f"  {path}: {code} x{count}")
              sys.exit(1)
          print("No hidden/zero-width characters found.")
          EOF

  test-self-guard:
    name: Test self-guard hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test mode F detection (ask instead of do)
        run: |
          RESULT=$(echo '{"stop_hook_active": false, "last_assistant_message": "Want me to fix that for you?"}' | python hooks/self-guard.py)
          echo "Result: $RESULT"
          echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('decision')=='block', f'Expected block, got {d}'"

      - name: Test clean pass (no detection)
        run: |
          RESULT=$(echo '{"stop_hook_active": false, "last_assistant_message": "I fixed the bug in line 42. The issue was a missing null check."}' | python hooks/self-guard.py)
          echo "Result: $RESULT"
          echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('decision','')!='block', f'Unexpected block: {d}'"

      - name: Test re-entry guard (stop_hook_active)
        run: |
          RESULT=$(echo '{"stop_hook_active": true, "last_assistant_message": "Want me to fix that?"}' | python hooks/self-guard.py)
          echo "Result: $RESULT"
          echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('decision','')!='block', f'Should not block on re-entry: {d}'"

  test-self-guard-install:
    name: Test self-guard installer
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fresh install registers the hook with the correct nested shape
        shell: bash
        run: |
          python hooks/install.py
          python - <<'PYEOF'
          import json, os
          settings_path = os.path.join(os.path.expanduser("~"), ".claude", "settings.json")
          with open(settings_path, "r", encoding="utf-8") as f:
              settings = json.load(f)
          stop = settings["hooks"]["Stop"]
          assert len(stop) == 1, f"expected 1 Stop entry, got {len(stop)}"
          hooks = stop[0]["hooks"]
          assert len(hooks) == 1 and "self-guard.py" in hooks[0]["command"], f"bad shape: {stop}"
          print("OK: fresh install registered correctly")
          PYEOF

      - name: Re-running install is idempotent (no duplicate entry)
        shell: bash
        run: |
          python hooks/install.py
          python - <<'PYEOF'
          import json, os
          settings_path = os.path.join(os.path.expanduser("~"), ".claude", "settings.json")
          with open(settings_path, "r", encoding="utf-8") as f:
              settings = json.load(f)
          stop = settings["hooks"]["Stop"]
          assert len(stop) == 1, f"expected still 1 Stop entry after reinstall, got {len(stop)}"
          print("OK: reinstall did not duplicate")
          PYEOF

      - name: Uninstall removes only self-guard's own entry
        shell: bash
        run: |
          python hooks/install.py --uninstall
          python - <<'PYEOF'
          import json, os
          settings_path = os.path.join(os.path.expanduser("~"), ".claude", "settings.json")
          with open(settings_path, "r", encoding="utf-8") as f:
              settings = json.load(f)
          stop = settings.get("hooks", {}).get("Stop", [])
          assert stop == [], f"expected Stop hooks cleared, got {stop}"
          print("OK: uninstall cleaned up")
          PYEOF

      - name: Install preserves a pre-existing Stop hook and other settings
        shell: bash
        run: |
          python - <<'PYEOF'
          import json, os
          claude_dir = os.path.join(os.path.expanduser("~"), ".claude")
          os.makedirs(claude_dir, exist_ok=True)
          settings = {
              "model": "some-model",
              "hooks": {
                  "Stop": [
                      {"hooks": [{"type": "command", "command": "python /existing/other-hook.py", "timeout": 10}]}
                  ]
              },
          }
          with open(os.path.join(claude_dir, "settings.json"), "w", encoding="utf-8") as f:
              json.dump(settings, f)
          PYEOF
          python hooks/install.py
          python - <<'PYEOF'
          import json, os
          settings_path = os.path.join(os.path.expanduser("~"), ".claude", "settings.json")
          with open(settings_path, "r", encoding="utf-8") as f:
              settings = json.load(f)
          assert settings["model"] == "some-model", "existing top-level key was lost"
          stop = settings["hooks"]["Stop"]
          assert len(stop) == 2, f"expected existing hook + self-guard = 2 entries, got {len(stop)}"
          commands = [h["command"] for entry in stop for h in entry["hooks"]]
          assert any("other-hook.py" in c for c in commands), "existing hook was dropped"
          assert any("self-guard.py" in c for c in commands), "self-guard hook missing"
          print("OK: existing Stop hook preserved, self-guard appended")
          PYEOF
